name: "🚀 Android 13 量子内核工坊"

on: 
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "✨ 启用调试模式"
        required: false
        type: boolean

env:
  _CONFIG_FILE: "repos.json"
  _OUTPUT_DIR: "quantum_out"
  _DEFCONFIG: "a13_ovo_defconfig"

jobs:
  # ========================
  # 🌌 配置加载模块
  # ========================
  Quantum-Config-Loader:
    name: "🔮 星图解析中心"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config-decoder.outputs.matrix }}
    
    steps:
      - name: "📥 获取星图数据"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🔍 验证星图完整性"
        id: config-decoder
        run: |
          if ! jq empty $_CONFIG_FILE; then
            echo "::error file=$_CONFIG_FILE::❌ 星图数据异常！"
            exit 1
          fi
          echo "matrix=$(jq -c . $_CONFIG_FILE)" >> $GITHUB_OUTPUT

  # ========================
  # 🛠️ 核心编译模块
  # ========================
  Build-Kernel:
    name: "⚡ 量子编译工坊"
    needs: [Quantum-Config-Loader]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Quantum-Config-Loader.outputs.matrix) }}

    env:
      _TOOLCHAIN_CACHE: "clang-17.tar.gz"
      _EMOJIS: ["🚀","⚡","🔧","🎯","📦","🎵","🌐","🛠️","💫"]

    steps:
      # ========================
      # 🌟 初始化阶段
      # ========================
      - name: "🌌 创建量子工作区"
        id: init-space
        run: |
          kernel_dir="${MATRIX_NAME}_${MATRIX_DEVICE}"
          echo "kernelDir=$kernel_dir" >> $GITHUB_ENV
          mkdir -p $kernel_dir && echo "🪐 工作区路径: $(pwd)/$kernel_dir"
        env:
          MATRIX_NAME: ${{ matrix.repos.kernelSource.name }}
          MATRIX_DEVICE: ${{ matrix.repos.kernelSource.device }}

      # ========================
      # 📦 依赖安装
      # ========================
      - name: "⚙️ 安装宇宙基础组件"
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential device-tree-compiler bc git zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev \
            python3 libarchive-tools libfl-dev lftp

      # ========================
      # 🌐 源码管理
      # ========================
      - name: "📡 量子纠缠克隆"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone -b ${{ matrix.repos.kernelSource.branch }} \
            ${{ matrix.repos.kernelSource.repo }} \
            --depth=1 --single-branch 2>&1 | sed 's/^/    📡 /'

      # ========================
      # 🔧 工具链配置
      # ========================
      - name: "🛠️ 量子工具链"
        working-directory: ./${{ env.kernelDir }}
        run: |
          for toolchain in $(echo "${{ toJSON(matrix.repos.toolchains) }}" | jq -c '.[]'); do
            name=$(jq -r '.name' <<< "$toolchain")
            echo "⚙️ 部署 $name 工具链..."
            wget -q https://github.com/qwe28256/LGG8-Mcstark-Kernel-Builder/releases/download/17.0/clang-17.tar.gz
            tar zxf $_TOOLCHAIN_CACHE
            mv clang-17 $name
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
          done

      # ========================
      # ⚙️ 编译参数生成
      # ========================
      - name: "🎛️ 量子参数合成"
        id: build-args
        working-directory: ./${{ env.kernelDir }}
        run: |
          args=("-j$(nproc)")
          params='${{ toJSON(matrix.repos.params) }}'
          
          declare -A param_map=(
            ['ARCH']='ARCH'
            ['CROSS_COMPILE']='CROSS_COMPILE'
            ['CLANG_TRIPLE']='CLANG_TRIPLE'
            ['AR']='AR'
            ['CC']='CC'
          )

          for key in "${!param_map[@]}"; do
            val=$(jq -r ".${key}" <<< "$params")
            [ -n "$val" ] && args+=("${param_map[$key]}=$val")
          done

          echo "args=${args[@]}" >> $GITHUB_OUTPUT
          echo "::group::🔧 最终编译参数"
          echo "${args[@]}"
          echo "::endgroup::"

      # ========================
      # 🔒 KernelSU 集成
      # ========================
      - name: "🛡️ 安全核心注入"
        if: ${{ matrix.repos.withKernelSU }}
        working-directory: ./${{ env.kernelDir }}/${{ matrix.repos.kernelSource.name }}
        run: |
          curl -sL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          config_file="arch/${{ env.ARCH }}/configs/$_DEFCONFIG"
          
          ksu_flags=(
            "CONFIG_KPROBES=y"
            "CONFIG_HAVE_KPROBES=y"
            "CONFIG_KPROBE_EVENTS=y"
          )

          for flag in "${ksu_flags[@]}"; do
            grep -q "^$flag" "$config_file" || echo -e "\n$flag" >> "$config_file"
          done

      # ========================
      # ⚡ 编译执行阶段
      # ========================
      - name: "🌀 启动量子编译"
        working-directory: ./${{ env.kernelDir }}/${{ matrix.repos.kernelSource.name }}
        run: |
          make ${{ steps.build-args.outputs.args }} $_DEFCONFIG | sed 's/^/    🔨 /'
          make ${{ steps.build-args.outputs.args }} | sed 's/^/    ⚡ /'

      # ========================
      # 📦 产物打包阶段
      # ========================
      - name: "🚀 量子压缩协议"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone -q https://github.com/qwe28256/AnyKernel3-alphalm anykernel
          cp ${{ env._OUTPUT_DIR }}/arch/arm64/boot/Image.gz anykernel/
          zip -r9 kernel_${{ matrix.repos.kernelSource.device }}_$(date +%s).zip anykernel/*
          mv *.zip ${{ env._OUTPUT_DIR }}/

      # ========================
      # 📤 星际传输通道
      # ========================
      - name: "🌌 量子纠缠上传"
        uses: actions/upload-artifact@v4
        with:
          name: "Kernel_${{ matrix.repos.kernelSource.device }}"
          path: |
            ${{ env.kernelDir }}/${{ env._OUTPUT_DIR }}/*.zip
            ${{ env.kernelDir }}/${{ env._OUTPUT_DIR }}/arch/arm64/boot/Image*
          retention-days: 7
